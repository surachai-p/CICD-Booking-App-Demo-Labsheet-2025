# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Backend CI/CD Pipeline — Node.js/Express → Render
# Repository: surachai-p/booking-app-demo-2025
#
# กระบวนการ:
# push/PR → lint → unit-tests ┐
#                              ├→ security-tests → deploy (main only)
#                 integration-tests ┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
name: 🔧 Backend CI/CD

# ─── Triggers ──────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

# ─── Global Environment Variables ──────────────────────────────────────────
env:
  NODE_VERSION: '18'
  WORKING_DIR: ./backend

# ─── ป้องกัน duplicate workflow runs ───────────────────────────────────────
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
jobs:
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Lint — ตรวจสอบ code style ด้วย ESLint
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: 🔍 ESLint Code Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json  # cache key

      - name: 📦 Install dependencies (ci = reproducible install)
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: 🔍 Run ESLint
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run lint

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Unit Tests — ทดสอบ business logic แต่ละ function
  # ─────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: 🧪 Unit Tests + Coverage
    runs-on: ubuntu-latest
    needs: lint         # รอให้ lint ผ่านก่อน (fail fast)
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: 🧪 Run Unit Tests with Coverage
        working-directory: ${{ env.WORKING_DIR }}
        run: npm test -- --coverage --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-github-actions-ci-only

      - name: 📊 Upload Coverage to Artifacts
        uses: actions/upload-artifact@v4
        if: always()       # อัปโหลดแม้ tests ไม่ผ่าน (เพื่อ debug)
        with:
          name: backend-coverage-${{ github.run_number }}
          path: backend/coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3: Integration Tests — ทดสอบ API endpoints ร่วมกับ Database
  # ─────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: 🔗 Integration Tests (API + DB)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    services:
      # สร้าง PostgreSQL container สำหรับ integration tests
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: 🗄️ Setup Test Database
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "Running database migrations for test environment..."
          npm run db:migrate
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/booking_test

      - name: 🔗 Run Integration Tests
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run test:integration -- --forceExit
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/booking_test
          JWT_SECRET: test-secret-key-for-github-actions-ci-only
          CORS_ORIGIN: http://localhost:5173
          PORT: 3001

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4: Security Tests — ทดสอบ security headers และ vulnerability
  # ─────────────────────────────────────────────────────────────────────────
  security-tests:
    name: 🔒 Security Tests + Audit
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: 🔒 Run Security Tests (Helmet, CORS, Rate Limit, JWT)
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run test:security -- --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-github-actions-ci-only
          CORS_ORIGIN: http://localhost:5173

      - name: 🛡️ npm Audit — Scan for Vulnerabilities
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 Full Audit Report:"
          npm audit --json | tee audit-report.json || true

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚨 Checking for HIGH/CRITICAL:"
          npm audit --audit-level=high
          
      - name: 📋 Upload Audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report-${{ github.run_number }}
          path: backend/audit-report.json
          retention-days: 30

      - name: 🔍 Check for Hardcoded Secrets
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true     # ไม่ fail workflow แต่แสดง warning
        with:
          path: ./backend
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 5: Deploy — Deploy ไป Render เฉพาะ main branch เท่านั้น
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Render (Production)
    runs-on: ubuntu-latest
    # ต้องผ่านทุก tests และเป็น push ไป main เท่านั้น
    needs: [unit-tests, integration-tests, security-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10

    # ─── Environment Protection ────────────────────────────────────────────
    environment:
      name: production
      url: ${{ secrets.RENDER_BACKEND_URL }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📋 Print Deployment Info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Deploying to Render Production"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run #: ${{ github.run_number }}"

      - name: 🚀 Trigger Render Deploy Hook
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          
          echo "Render API Response: HTTP $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
            echo "✅ Deploy hook triggered successfully"
          else
            echo "❌ Deploy hook failed with HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: ⏳ Wait for Render to Build & Deploy
        run: |
          echo "Waiting for Render to build and deploy (90 seconds)..."
          sleep 90

      - name: 🔍 Health Check — Verify Deployment
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          echo "Checking: $BACKEND_URL/api/health"
          
          MAX_RETRIES=6
          RETRY_DELAY=30
          
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 \
              "$BACKEND_URL/api/health")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Health check passed on attempt $i!"
              exit 0
            fi
            
            echo "⏳ Attempt $i/$MAX_RETRIES: HTTP $HTTP_STATUS — waiting ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: 🔒 Post-Deploy Security Check
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          
          echo "Checking security headers..."
          HEADERS=$(curl -sI "$BACKEND_URL/api/health")
          
          # ตรวจสอบ security headers
          check_header() {
            if echo "$HEADERS" | grep -qi "$1"; then
              echo "✅ $2"
            else
              echo "⚠️  Missing: $2"
            fi
          }
          
          check_header "X-Content-Type-Options" "X-Content-Type-Options"
          check_header "X-Frame-Options" "X-Frame-Options"
          check_header "Content-Security-Policy" "Content-Security-Policy"

      - name: 🎉 Deployment Summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ DEPLOYMENT SUCCESSFUL!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "URL: ${{ secrets.RENDER_BACKEND_URL }}"
          echo "SHA: ${{ github.sha }}"
          echo "By:  ${{ github.actor }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
